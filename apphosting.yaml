env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: i-muslim-com.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME

  - variable: FIREBASE_DATABASE_ID
    value: main
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://i-muslim.com
    availability:
      - BUILD
      - RUNTIME

  # --- /apps/quran live release data (lib/apps/quran-releases.ts) ----------
  # Uncomment after creating the secrets — App Hosting fails the rollout if a
  # referenced secret doesn't exist or isn't granted:
  #   firebase apphosting:secrets:set QURAN_APP_REPO_TOKEN
  #   firebase apphosting:secrets:set REVALIDATE_SECRET
  #
  # QURAN_APP_REPO_TOKEN: fine-grained GitHub PAT, read-only Contents access to
  # CaspianTools/i-muslim-quran only — lets the site read releases out of that
  # repo's play-assets/store-listing.html. Until it's set, /apps/quran serves
  # the committed snapshot in lib/apps/quran.ts (the pre-automation behavior).
  #
  # - variable: QURAN_APP_REPO_TOKEN
  #   secret: QURAN_APP_REPO_TOKEN
  #   availability:
  #     - RUNTIME
  #
  # REVALIDATE_SECRET: bearer for POST /api/revalidate/quran-app, which
  # refreshes the cached release data instantly instead of within the hour.
  # Optional — the endpoint answers 503 while unset.
  #
  # - variable: REVALIDATE_SECRET
  #   secret: REVALIDATE_SECRET
  #   availability:
  #     - RUNTIME

  # Pin the runtime timezone to UTC. The prayer-time / Hijri / ICS routes build
  # dates via Date.UTC(...) and hand them to `adhan` / `@umalqura/core`, which
  # read the runtime-LOCAL date components — correct only while the runtime is
  # UTC. Cloud Run already defaults to UTC; pinning it here removes the latent
  # off-by-one-day risk if that default ever changes.
  - variable: TZ
    value: UTC
    availability:
      - BUILD
      - RUNTIME
  - variable: QURAN_APP_REPO_TOKEN
    secret: QURAN_APP_REPO_TOKEN

# Cloud Run sizing/scaling. minInstances stays 0 so nothing bills while idle
# (the app cold-starts on the first request); maxInstances caps worst-case
# fan-out (a traffic spike or runaway loop) so spend is bounded. Bump the cap if
# real traffic (e.g. Ramadan) starts hitting it. cpu/memory are the App Hosting
# defaults, pinned here so they don't drift — keep memory at 512 (firebase-admin
# + 8 preloaded fonts won't fit comfortably in 256).
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80
